    <title>Plant Manager</title>

     <!-- add a link to the css file -->
     <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
        <!-- h1 is heading1 the page title -->
        <h1>Housesitting Plant Manager</h1>

    <div>
        <!-- any messages for the user will go here -->

        <ul id="ulPlants"></ul>

        <label for="txtNewPlant">Plant name:</label> <input type="text" id="txtNewPlant">
        <button onclick="addPlant();">Add Plant</button>
    </div>
